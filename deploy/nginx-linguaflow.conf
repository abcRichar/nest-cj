# ============================================================
# LinguaFlow 站点配置
# 落盘位置（宝塔标准路径）：/www/server/panel/vhost/nginx/<你的域名>.conf
#
# 若已在宝塔面板申请过 SSL 证书，粘贴时请保留原有的 #SSL-START / #SSL-END 段，
# 只替换其余部分；或者只把下面 5 个 location 段插进现有 server 块里。
#
# 两个后端进程都只监听 127.0.0.1，外网只能通过本文件的 nginx 访问。
# 端口按实际情况改：8090 = 主业务服务，8091 = AI 服务。
# ============================================================

server {
    listen 80;
    server_name your-domain.com;

    # ★ 指向构建产物目录（dist 的内容），不要指向源码目录
    root /www/wwwroot/linguaflow/apps/web/dist;
    index index.html;

    # 分片上传单片 5MB，前端转 base64 后约 6.7MB，留足余量
    client_max_body_size 30m;

    access_log /www/wwwlogs/linguaflow.log;
    error_log  /www/wwwlogs/linguaflow.error.log;

    # ---------- 1. 前端 SPA ----------
    # 刷新 /admin/users 这类前端路由不能 404，必须回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的构建产物可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---------- 2. 主业务接口（含 SSE 流式对话） ----------
    location /api/ {
        # ★★ proxy_pass 结尾绝对不能带斜杠！
        #    带斜杠会吃掉 /api 前缀，后端收到 /auth/login 直接 404
        proxy_pass http://127.0.0.1:8090;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ▼▼▼ SSE 三项，缺任何一个前端都看不到「逐字输出」效果 ▼▼▼
        # 默认 nginx 会缓冲响应体，导致模型生成完才一次性吐给浏览器
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
    }

    # ---------- 3. Socket.IO（支付结果实时推送 / 系统公告） ----------
    # ★ 代理的是 /socket.io/，不是 /ws！
    #   /ws 是 Socket.IO 的 namespace（走协议层），真正的握手与升级走 engine.io 默认路径 /socket.io/
    location /socket.io/ {
        proxy_pass http://127.0.0.1:8090;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_buffering off;
        proxy_read_timeout 3600s;   # 长连接，别被 60s 默认值掐断
    }

    # ---------- 4. 对象存储降级出口 ----------
    # 未部署 MinIO 时，文件会落到 apps/server/storage，并通过 /static/** 访问
    location /static/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        expires 7d;
    }

    # ---------- 5. 兜底防护：源码与配置不对外 ----------
    location ~ ^/(\.env|\.git|prisma|node_modules|logs) {
        deny all;
    }
    location ~ /\.(?!well-known) {
        deny all;
    }
}

# ============================================================
# 装好证书后，宝塔会自动在站点 conf 里生成 443 server 段。
# 记得把上面这 5 个 location 段也同步到 443 的 server 块里
#（或者在 80 段里加一句 return 301 https://$host$request_uri; 做全站跳转）。
#
# 改完配置后用下面的命令让它真的生效（宝塔的 nginx -s reload 在这台机器上会静默失效）：
#   kill -HUP $(cat /www/server/nginx/logs/nginx.pid)
# 验证是否生效：
#   ps -o pid,lstart,cmd -C nginx     # 看 worker 启动时间有没有变
# ============================================================
